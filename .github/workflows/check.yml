name: Kleinanzeigen Check

on:
  schedule:
    # Jede volle Stunde. Anpassbar, z.B. "*/30 * * * *" fuer alle 30 Minuten.
    # Vorsicht bei kuerzeren Intervallen: erhoeht das Risiko, von
    # Kleinanzeigen.de geblockt zu werden.
    - cron: "0 * * * *"
  workflow_dispatch: {}  # erlaubt manuelles Anstoßen über den "Run workflow"-Button

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Skript ausführen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python check_kleinanzeigen.py

      - name: Änderungen committen
        run: |
          git config user.name "kleinanzeigen-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json docs/index.html
          git diff --quiet --cached || git commit -m "Auto-Update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
